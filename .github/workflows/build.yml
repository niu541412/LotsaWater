name: Build LotsaWater

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v7

      - name: Build screen saver
        run: |
          xcodebuild \
            -project LotsaWater.xcodeproj \
            -target LotsaWater \
            -configuration Release \
            -sdk macosx \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build-${{ matrix.arch }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Package screen saver
        run: |
          SAVER="build-${{ matrix.arch }}/LotsaWater.saver"
          test -d "$SAVER"
          test "$(lipo -archs "$SAVER/Contents/MacOS/LotsaWater")" = "${{ matrix.arch }}"
          codesign --verify --deep --strict --verbose=2 "$SAVER"
          ditto -c -k --sequesterRsrc --keepParent "$SAVER" "LotsaWater-${{ matrix.arch }}.saver.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: LotsaWater-${{ matrix.arch }}
          path: LotsaWater-${{ matrix.arch }}.saver.zip

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.saver.zip
